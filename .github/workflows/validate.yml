name: Validate models

# Walk-forward backtest per sport and competition (pipeline/validate.py).
# Writes data/validation.json; the app marks competitions without it as "not validated".
on:
  schedule:
    - cron: "17 3 * * 1"          # every Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      part:
        description: "football,nhl,nba,euroleague,uefa"
        default: "football,nhl,nba,euroleague,uefa"

permissions:
  contents: write

concurrency:
  group: validate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Restore source cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: odds-cache-${{ github.run_id }}
          restore-keys: odds-cache-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validate
        run: python -m pipeline.validate --part "${{ github.event.inputs.part || 'football,nhl,nba,euroleague,uefa' }}" 2>&1 | grep --line-buffered -v " INFO pipeline.espn"

      - name: Commit validation results
        run: |
          git config user.name "odds-room-bot"
          git config user.email "odds-room-bot@users.noreply.github.com"
          git add data/validation.json
          if git diff --cached --quiet; then
            echo "Validation unchanged"
            exit 0
          fi
          git commit -m "Validation $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
